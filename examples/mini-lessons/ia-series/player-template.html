<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__LESSON_TITLE__ · Pixel Night</title>
<style>*{box-sizing:border-box}body{margin:0;background:#04142d;color:#f4f9ff;font:16px system-ui,-apple-system,sans-serif}.app{max-width:1100px;margin:auto;padding:12px}h1{font-size:clamp(20px,4vw,36px);color:#ffde55;margin:6px 0 12px}.viewport{width:100%;aspect-ratio:5/4;background:#04142d;border:4px solid #20ddec;overflow:hidden;box-shadow:0 0 0 4px #15496a}.viewport svg,.viewport img{display:block;width:100%;height:100%;object-fit:contain}.controls{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:14px 0}.controls button{background:#123957;color:white;border:2px solid #20ddec;border-radius:5px;padding:10px 12px;font-weight:700;cursor:pointer}.controls button.active{background:#ffde55;color:#071b36;border-color:#ffde55}.controls button:focus,input:focus{outline:3px solid #fff}.status{color:#a9d3e4;margin:8px 0}.seek{width:100%;accent-color:#ffde55}.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin:12px 0}.grid button{background:#102d4b;color:#fff;border:1px solid #2bbddd;padding:9px 1px;cursor:pointer}.grid button.current{background:#ffde55;color:#071b36}.help{color:#a9c5d7;line-height:1.4;font-size:14px}noscript{color:#ffe57b}@media(max-width:550px){.controls button{font-size:13px;padding:8px}.grid button{font-size:12px}}</style></head>
<body><main class="app"><h1>__LESSON_TITLE__</h1><div id="canvas" class="viewport"><img alt="Abertura da aula" src="__FALLBACK_IMAGE__"></div><noscript>Para movimentar as peças, abra o arquivo baixado no Safari ou em outro navegador com JavaScript.</noscript>
<div class="controls"><button id="slides" class="active">▣ Modo slides</button><button id="video">▶ Modo vídeo</button><button id="prev">◀ Anterior</button><button id="next">Próximo ▶</button><button id="pause">❚❚ Pausar</button><button id="restart">↺ Reiniciar</button></div><input id="seek" class="seek" type="range" min="0" max="160" step="0.05" value="0" aria-label="Linha do tempo"><div id="status" class="status">Carregando...</div><div id="grid" class="grid"></div><p class="help">No modo slides, a cena atual continua animada enquanto você lê; use Anterior/Próximo ou deslize no quadro. No modo vídeo, as oito cenas avançam automaticamente em cerca de 2min40. Espaço pausa; ← e → mudam de slide.</p></main>
<script>
__SHARED_SOURCE__
const lesson=__LESSON__,ASSETS=__ASSETS__;const asset=name=>ASSETS[name]||'';
const el=id=>document.getElementById(id),canvas=el('canvas'),seek=el('seek'),status=el('status'),grid=el('grid');
let sceneIndex=0,local=0,mode='slides',playing=true,last=0,lastDraw=-1;
const starts=[0];for(const scene of lesson.scenes)starts.push(starts.at(-1)+scene.duration);seek.max=starts.at(-1);
const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}`;
function draw(){const scene=lesson.scenes[sceneIndex];canvas.innerHTML=renderPixelSvg(scene.data.pixelScene,local,asset);seek.value=starts[sceneIndex]+local;status.textContent=`${String(sceneIndex+1).padStart(2,'0')} / 08 · ${scene.title} · ${fmt(starts[sceneIndex]+local)} / ${fmt(starts.at(-1))} · ${mode==='slides'?'slide animado':'vídeo contínuo'}`;[...grid.children].forEach((b,i)=>b.classList.toggle('current',i===sceneIndex));lastDraw=Math.floor(local*15)}
function setScene(n){sceneIndex=Math.max(0,Math.min(7,n));local=0;last=0;draw()}
function setMode(next){mode=next;el('slides').classList.toggle('active',mode==='slides');el('video').classList.toggle('active',mode==='video');playing=true;el('pause').textContent='❚❚ Pausar';last=0;draw()}
function tick(stamp){if(playing){const delta=last?Math.min(.12,(stamp-last)/1000):0;last=stamp;local+=delta;const d=lesson.scenes[sceneIndex].duration;if(local>=d){if(mode==='slides')local=local%d;else if(sceneIndex<7){local-=d;sceneIndex++}else{local=d;playing=false;el('pause').textContent='▶ Continuar'}}if(Math.floor(local*15)!==lastDraw||!playing)draw()}requestAnimationFrame(tick)}
el('slides').onclick=()=>setMode('slides');el('video').onclick=()=>setMode('video');el('prev').onclick=()=>setScene(sceneIndex-1);el('next').onclick=()=>setScene(sceneIndex+1);el('restart').onclick=()=>setScene(0);el('pause').onclick=()=>{playing=!playing;last=0;el('pause').textContent=playing?'❚❚ Pausar':'▶ Continuar'};
seek.oninput=()=>{let t=+seek.value;sceneIndex=lesson.scenes.findIndex((_,i)=>t<starts[i+1]);if(sceneIndex<0)sceneIndex=7;local=Math.min(lesson.scenes[sceneIndex].duration,t-starts[sceneIndex]);last=0;draw()};
lesson.scenes.forEach((s,i)=>{const b=document.createElement('button');b.textContent=String(i+1).padStart(2,'0');b.title=s.title;b.onclick=()=>setScene(i);grid.append(b)});
document.addEventListener('keydown',e=>{if(e.code==='ArrowLeft')setScene(sceneIndex-1);if(e.code==='ArrowRight')setScene(sceneIndex+1);if(e.code==='Space'){e.preventDefault();el('pause').click()}});
let touchX=0;canvas.addEventListener('touchstart',e=>touchX=e.changedTouches[0].screenX,{passive:true});canvas.addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-touchX;if(Math.abs(dx)>50)setScene(sceneIndex+(dx<0?1:-1))},{passive:true});draw();requestAnimationFrame(tick);
</script></body></html>
