name: engine-check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: engine-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - run: npm run test:production
      - run: npm run production:validate
      - run: npm run pixel:html
