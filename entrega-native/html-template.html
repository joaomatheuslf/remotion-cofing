<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel Night — aula com elementos animados</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#fff6e4;background:#04132b;font-family:system-ui,sans-serif}.app{max-width:1100px;padding:16px;margin:auto}h1{color:#ffde55;font-size:22px}.viewport{aspect-ratio:5/4;width:100%;border:4px solid #39dfff;background:#04132b}.viewport svg{display:block;width:100%;height:100%}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}button{cursor:pointer;padding:12px;background:#102c47;border:2px solid #39dfff;color:#fff6e4;font-weight:bold}button.primary{background:#ffde55;color:#04132b}input{width:100%;accent-color:#ffde55;margin-top:16px}.meta{margin:12px 0;color:#b3cadd}.chapters{display:none;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}.chapters.open{display:grid}.help{font-size:14px;line-height:1.5;color:#b3cadd}
</style></head><body><main class="app"><h1>O GUARDA-CHUVA DA IA</h1><div id="canvas" class="viewport">__FALLBACK_SVG__</div><noscript><p>Este visualizador de arquivos não executa o player. Abra a aula em um navegador para reproduzir as animações.</p></noscript><div class="controls"><button id="prev">◀ Anterior</button><button id="play" class="primary">▶ Reproduzir</button><button id="next">Próximo ▶</button><button id="restart">↺ Reiniciar</button><button id="overview">☷ Cenas</button></div><input id="seek" type="range" min="0" max="150" step="0.033333" value="0" aria-label="Linha do tempo"><div id="meta" class="meta">01 / 18 · 00:00 / 02:30</div><div id="chapters" class="chapters"></div><p class="help">Texto, personagem, nós, conexões e sinais são elementos independentes. Espaço: pausar · setas: cenas. No iPhone, a prévia de arquivo mostra a aula parada; o player interativo precisa de navegador.</p></main>
<script>
__SHARED_SOURCE__
const lesson=__LESSON__,ASSETS=__ASSETS__;
const asset=name=>ASSETS[name]||'assets/'+name;
const canvas=document.getElementById('canvas'),seek=document.getElementById('seek'),play=document.getElementById('play'),meta=document.getElementById('meta');
const starts=[0];for(const scene of lesson.scenes)starts.push(starts[starts.length-1]+scene.duration);const total=starts[starts.length-1];seek.max=total;
let clock=0,playing=false,last=0,index=0,drawnFrame=-1;
const fmt=t=>`${String(Math.floor(t/60)).padStart(2,'0')}:${String(Math.floor(t%60)).padStart(2,'0')}`;
function renderAt(seconds){clock=Math.max(0,Math.min(total,seconds));index=lesson.scenes.findIndex((s,i)=>clock<starts[i+1]);if(index<0)index=lesson.scenes.length-1;canvas.innerHTML=renderPixelSvg(lesson.scenes[index].data.pixelScene,clock-starts[index],asset);seek.value=clock;meta.textContent=`${String(index+1).padStart(2,'0')} / ${lesson.scenes.length} · ${lesson.scenes[index].title} · ${fmt(clock)} / ${fmt(total)}`;drawnFrame=Math.floor(clock*30);}
function setPlaying(value){playing=value;last=0;play.textContent=value?'❚❚ Pausar':'▶ Reproduzir';}
function tick(stamp){if(playing){const next=Math.min(total,clock+(last?(stamp-last)/1000:0));last=stamp;if(Math.floor(next*30)!==drawnFrame||next===total)renderAt(next);else clock=next;if(clock>=total)setPlaying(false);}requestAnimationFrame(tick);}
function jump(delta){renderAt(starts[Math.max(0,Math.min(lesson.scenes.length-1,index+delta))]);last=0;}
play.onclick=()=>{if(clock>=total)renderAt(0);setPlaying(!playing);};document.getElementById('prev').onclick=()=>jump(-1);document.getElementById('next').onclick=()=>jump(1);document.getElementById('restart').onclick=()=>{renderAt(0);setPlaying(false);};seek.oninput=()=>{renderAt(Number(seek.value));last=0;};
const chapters=document.getElementById('chapters');document.getElementById('overview').onclick=()=>chapters.classList.toggle('open');lesson.scenes.forEach((scene,i)=>{const b=document.createElement('button');b.textContent=`${String(i+1).padStart(2,'0')} · ${scene.title}`;b.onclick=()=>{renderAt(starts[i]);last=0;chapters.classList.remove('open');};chapters.append(b);});
document.addEventListener('keydown',e=>{if(e.target===seek)return;if(e.code==='Space'){e.preventDefault();play.click();}if(e.code==='ArrowRight')jump(1);if(e.code==='ArrowLeft')jump(-1);});renderAt(0);requestAnimationFrame(tick);
</script></body></html>
